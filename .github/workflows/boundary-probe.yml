name: boundary-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify disposable environment secret without printing it
        env:
          BOUNDARY_SENTINEL: ${{ secrets.BOUNDARY_SENTINEL }}
          BOUNDARY_SENTINEL_SHA256: ${{ vars.BOUNDARY_SENTINEL_SHA256 }}
        run: node src/boundary-probe.mjs
